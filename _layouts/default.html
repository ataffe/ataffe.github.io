<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <!-- Favicon: SVG for modern browsers, PNG fallback, and the iOS home-screen icon. -->
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

    <!-- Avoid a flash of the wrong theme: only matters for visitors who
         previously switched to light mode, since dark is the server-rendered default. -->
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Site CSS (Tailwind, compiled via `npm run build:css`) -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <!-- Google tag (gtag.js). Only emitted for a production build, so local
         `jekyll serve` / `jekyll build` runs never report to Analytics.
         GitHub Pages sets JEKYLL_ENV=production for us; to exercise the tag
         locally, run `JEKYLL_ENV=production bundle exec jekyll serve`. -->
    {% if jekyll.environment == "production" %}
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QJF8G4DK45"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QJF8G4DK45');
    </script>
    {% endif %}
</head>
<body class="flex min-h-screen flex-col">
    {% include navigation.html %}

    <main class="flex-1">
        {{ content }}
    </main>

    {% include footer.html %}
</body>
</html>
